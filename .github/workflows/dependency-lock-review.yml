name: Resolve reviewed dependency lock
on:
  push:
    branches: [codex/reconcile-upstream-pr-15-20261022]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Resolve and record Cargo lock
        run: |
          cargo metadata --format-version 1 > /dev/null
          echo CARGO_LOCK_REVIEW_BEGIN
          base64 -w 0 Cargo.lock
          echo
          echo CARGO_LOCK_REVIEW_END
